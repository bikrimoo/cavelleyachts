<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0}
#side{position:fixed;left:0;top:0;z-index:99;background:#000;padding:10px;width:120px;height:100vh;overflow:auto}
#side button{display:block;width:100px;margin:4px 0;padding:6px;background:#c5a059;border:0;font:bold 12px Arial;cursor:pointer}
#f{position:absolute;left:130px;top:0;width:390px;height:9000px;border:0}
</style></head><body>
<div id="side"></div>
<iframe id="f" src="https://www.cavelleyachts.com/"></iframe>
<script>
const s=document.getElementById('side');
for(let y=3000;y<=8400;y+=300){
  const b=document.createElement('button');
  b.textContent=y;
  b.onclick=()=>window.scrollTo(0,y);
  s.appendChild(b);
}
</script>
</body></html>
