<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0}
#side{position:fixed;left:0;top:0;z-index:99;background:#000;padding:8px;width:150px;height:100vh;overflow:auto}
#side button{display:block;width:130px;margin:3px 0;padding:5px;background:#c5a059;border:0;font:bold 11px Arial;cursor:pointer}
#wrap{position:absolute;left:160px;top:0;width:780px;overflow:hidden}
#f{width:390px;height:9000px;border:0;transform:scale(2);transform-origin:top left}
</style></head><body>
<div id="side"></div>
<div id="wrap"><iframe id="f" src="https://www.cavelleyachts.com/"></iframe></div>
<script>
const s=document.getElementById('side');
for(let y=3000;y<=8400;y+=300){
  const b=document.createElement('button');
  b.textContent='iframe y='+y;
  b.onclick=()=>window.scrollTo(0,y*2-((window.innerHeight-700)/2));
  s.appendChild(b);
}
</script>
</body></html>
