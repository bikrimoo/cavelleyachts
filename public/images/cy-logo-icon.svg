<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cf9e"/>
      <stop offset="40%" stop-color="#c5a982"/>
      <stop offset="100%" stop-color="#a07d50"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1f38"/>
      <stop offset="100%" stop-color="#061528"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="200" height="200" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="200" height="200" fill="url(#bgGrad)"/>
    
    <!-- Subtle inner border -->
    <rect x="10" y="10" width="180" height="180" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.25"/>

    <!-- C letter - elegant serif -->
    <path d="M 62 72
             C 62 52, 78 42, 96 42
             C 106 42, 114 45, 120 50
             L 112 58
             C 108 55, 103 53, 96 53
             C 84 53, 74 60, 74 72
             C 74 84, 84 91, 96 91
             C 103 91, 108 89, 112 86
             L 120 94
             C 114 99, 106 102, 96 102
             C 78 102, 62 92, 62 72 Z"
          fill="url(#goldGrad)"/>

    <!-- Y letter - elegant serif, interlocked with C -->
    <path d="M 96 56
             L 108 56
             L 122 74
             L 136 56
             L 148 56
             L 130 82
             L 130 102
             L 114 102
             L 114 82
             L 96 56 Z"
          fill="url(#goldGrad)"/>

    <!-- Wave 1 - refined -->
    <path d="M 50 130
             C 62 122, 74 122, 86 130
             C 98 138, 110 138, 122 130
             C 134 122, 146 122, 158 130"
          stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Wave 2 - lighter -->
    <path d="M 42 148
             C 54 140, 66 140, 78 148
             C 90 156, 102 156, 114 148
             C 126 140, 138 140, 150 148"
          stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45"/>

    <!-- Wave 3 - subtlest -->
    <path d="M 50 166
             C 62 158, 74 158, 86 166
             C 98 174, 110 174, 122 166
             C 134 158, 146 158, 158 166"
          stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.25"/>
  </g>
</svg>
